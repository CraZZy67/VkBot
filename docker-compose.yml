services:
  bot:
      build: ./bot
      container_name: bot
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        - db
    
  db:
      image: postgres
      container_name: db
      restart: unless-stopped
      ports:
        - 5432:5432
      env_file:
        - .env
      volumes:
        - pgdata:/var/lib/postgresql/18/docker

  adminer:
      image: adminer
      restart: unless-stopped
      container_name: adminer
      ports:
        - 127.0.0.1:8070:8080
      depends_on:
        - db

volumes:
  pgdata: