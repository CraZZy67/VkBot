services:
  bot:
      build: ./bot
      container_name: bot
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        - db
  
  scheduler:
      build: ./scheduler
      container_name: scheduler
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        - db
        - redis
  
  worker:
      build: ./worker
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        - db
        - redis
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  db:
      image: postgres
      container_name: db
      restart: unless-stopped
      ports:
        - 5432:5432
      env_file:
        - .env
      volumes:
        - pgdata:/var/lib/postgresql/18/docker

  adminer:
      image: adminer
      restart: unless-stopped
      container_name: adminer
      ports:
        - 8070:8080
      depends_on:
        - db

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  pgdata:
  redis_data:
  portainer_data: